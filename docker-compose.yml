version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: graf_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=graf_db
      - POSTGRES_USER=graf_user
      - POSTGRES_PASSWORD=graf_password
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: graf_web
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DB_HOST=db
      - DB_NAME=graf_db
      - DB_USER=graf_user
      - DB_PASSWORD=graf_password
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - db

volumes:
  postgres_data: