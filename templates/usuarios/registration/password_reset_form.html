{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña - Graf</title>
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body class="login-body">
    <div class="login-container">
        <h2>¿Olvidaste tu contraseña?</h2>
        <p>Ingresa tu correo electrónico y te enviaremos un enlace para restablecerla.</p>
        
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_email">Correo Electrónico:</label>
                <input type="email" name="email" id="id_email" required placeholder="tu@correo.com">
            </div>
            <button type="submit" class="btn-primary">Enviar enlace de recuperación</button>
        </form>
        
        <div class="login-footer">
            <a href="{% url 'login' %}">Volver al inicio de sesión</a>
        </div>
    </div>
</body>
</html>
